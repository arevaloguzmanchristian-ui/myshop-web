<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyShop · Panel Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23b71c1c'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>M</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b;
  --brand:#b71c1c; --brand-dark:#8e1515;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --info:#2563eb;
  --sidebar:#0f172a; --sidebar-text:#cbd5e1; --sidebar-active:#b71c1c;
}
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
.layout { display:flex; min-height:100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width:230px; min-width:230px; background:var(--sidebar); color:var(--sidebar-text);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-brand { padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.08); }
.sidebar-brand .logo { display:flex; align-items:center; gap:10px; }
.sidebar-brand .logo-badge { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#b71c1c,#7f0f0f); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:17px; }
.sidebar-brand h1 { font-size:15px; color:#fff; font-weight:700; }
.sidebar-brand small { font-size:10px; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; }
.sidebar-nav { padding:12px 10px; display:flex; flex-direction:column; gap:2px; flex:1; }
.sidebar-nav button, .sidebar-nav a {
  display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:none; background:none;
  color:var(--sidebar-text); font-size:13px; font-weight:500; cursor:pointer; border-radius:8px; text-decoration:none;
  transition:all .15s; font-family:inherit; text-align:left;
}
.sidebar-nav button:hover, .sidebar-nav a:hover { background:rgba(255,255,255,.06); color:#fff; }
.sidebar-nav button.active { background:var(--sidebar-active); color:#fff; }
.sidebar-nav .icon { width:18px; text-align:center; font-size:14px; }
.sidebar-nav .nav-sep { border-top:1px solid rgba(255,255,255,.08); margin:8px 6px; }
.sidebar-nav .badge-count { margin-left:auto; background:#dc2626; color:#fff; font-size:10px; font-weight:700; border-radius:99px; padding:2px 7px; }
.sidebar-foot { padding:12px 18px; border-top:1px solid rgba(255,255,255,.08); font-size:10px; color:#64748b; }

/* ===== MAIN ===== */
.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar {
  background:var(--card); border-bottom:1px solid var(--border); padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50;
}
.topbar h2 { font-size:18px; font-weight:700; }
.topbar .user { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
.topbar .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#b71c1c,#7f0f0f); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
.content { padding:24px; }

/* ===== CARDS / GRID ===== */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden; transition:transform .15s, box-shadow .15s; }
.stat-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(15,23,42,.08); }
.stat-card .stat-label { font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
.stat-card .stat-value { font-size:24px; font-weight:800; color:var(--text); line-height:1.1; }
.stat-card .stat-sub { font-size:11px; color:var(--muted); margin-top:4px; }
.stat-card .stat-accent { position:absolute; top:0; left:0; width:4px; height:100%; }
.accent-red { background:var(--brand); } .accent-green { background:var(--ok); } .accent-blue { background:var(--info); } .accent-amber { background:var(--warn); }

.card { background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:20px; overflow:hidden; }
.card-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.card-header h3 { font-size:14px; font-weight:700; }
.card-body { padding:18px 20px; }

/* ===== TABLE ===== */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
thead th { background:#f8fafc; color:var(--muted); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
tbody td { padding:11px 14px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
tbody tr:hover { background:#f8fafc; }
tbody tr:last-child td { border-bottom:none; }
.text-muted { color:var(--muted); }
.text-sm { font-size:11px; }
.text-right { text-align:right; }
.mono { font-family:Consolas,monospace; font-size:11.5px; }

/* ===== BADGES ===== */
.badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:10.5px; font-weight:700; text-transform:capitalize; }
.badge-success { background:#dcfce7; color:#15803d; }
.badge-warning { background:#fef3c7; color:#b45309; }
.badge-danger { background:#fee2e2; color:#b91c1c; }
.badge-info { background:#dbeafe; color:#1d4ed8; }
.badge-neutral { background:#f1f5f9; color:#475569; }

/* ===== BTN / FORM ===== */
.btn { display:inline-flex; align-items:center; gap:5px; padding:8px 14px; border-radius:9px; font-size:12px; font-weight:600; border:none; cursor:pointer; transition:all .15s; font-family:inherit; }
.btn-primary { background:var(--brand); color:#fff; } .btn-primary:hover { background:var(--brand-dark); }
.btn-success { background:var(--ok); color:#fff; } .btn-success:hover { filter:brightness(1.1); }
.btn-danger { background:var(--err); color:#fff; } .btn-danger:hover { filter:brightness(1.1); }
.btn-warn { background:var(--warn); color:#fff; } .btn-warn:hover { filter:brightness(1.1); }
.btn-outline { background:#fff; color:var(--muted); border:1px solid var(--border); } .btn-outline:hover { background:#f8fafc; color:var(--text); }
.btn-sm { padding:5px 10px; font-size:11px; border-radius:7px; }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
input[type="text"], input[type="search"], input[type="number"], input[type="password"], select, textarea {
  font-family:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--text); outline:none;
}
input:focus, select:focus, textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(183,28,28,.1); }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-group { display:flex; flex-direction:column; gap:5px; }
.form-group label { font-size:11px; font-weight:600; color:var(--muted); }
.form-group input, .form-group select, .form-group textarea { width:100%; }

/* ===== CHARTS (ventas 7 dias) ===== */
.chart { display:flex; align-items:flex-end; gap:10px; height:150px; padding:10px 0; }
.chart-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.chart-bar { width:100%; max-width:42px; border-radius:6px 6px 0 0; background:linear-gradient(180deg,#b71c1c,#7f0f0f); min-height:3px; transition:height .4s; position:relative; }
.chart-bar:hover { filter:brightness(1.15); }
.chart-val { font-size:10px; font-weight:700; color:var(--text); }
.chart-day { font-size:10px; color:var(--muted); font-weight:600; }

/* ===== MODAL ===== */
.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 24px 70px rgba(0,0,0,.25); animation:modalIn .2s ease; }
.modal-lg { max-width:720px; }
@keyframes modalIn { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
.modal h3 { font-size:16px; font-weight:700; margin-bottom:14px; }
.modal .close-x { position:sticky; top:0; float:right; background:#f1f5f9; border:none; width:30px; height:30px; border-radius:50%; cursor:pointer; color:var(--muted); font-size:14px; }

/* ===== TOAST ===== */
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:#0f172a; color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; opacity:0; transition:all .3s; z-index:2000; box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px; }
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
#toast.ok { background:#15803d; } #toast.err { background:#b91c1c; }

/* ===== LOADING ===== */
.loading { display:flex; flex-direction:column; align-items:center; gap:12px; padding:60px 0; color:var(--muted); font-size:13px; }
.spinner { width:30px; height:30px; border:3px solid #e2e8f0; border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; }
.empty .em { font-size:34px; margin-bottom:8px; }

/* ===== MISC ===== */
.flex { display:flex; gap:8px; align-items:center; }
.flex-between { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.mt-1 { margin-top:6px; } .mt-2 { margin-top:12px; } .mt-3 { margin-top:18px; }
.mb-1 { margin-bottom:6px; } .mb-2 { margin-bottom:12px; }
.search-box { position:relative; }
.search-box input { padding-left:32px; min-width:220px; }
.search-box .s-ic { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; }
.pill-filters { display:flex; gap:6px; flex-wrap:wrap; }
.pill { padding:5px 12px; border-radius:99px; font-size:11px; font-weight:600; background:#f1f5f9; color:var(--muted); border:none; cursor:pointer; transition:all .15s; }
.pill:hover { background:#e2e8f0; }
.pill.active { background:var(--brand); color:#fff; }

@media (max-width:768px) {
  .layout { flex-direction:column; }
  .sidebar { width:100%; min-width:0; height:auto; position:static; flex-direction:row; align-items:center; overflow-x:auto; }
  .sidebar-brand { padding:12px 16px; border-bottom:none; border-right:1px solid rgba(255,255,255,.08); }
  .sidebar-nav { flex-direction:row; padding:8px; overflow-x:auto; }
  .sidebar-nav button, .sidebar-nav a { white-space:nowrap; width:auto; padding:8px 10px; }
  .sidebar-nav .nav-sep, .sidebar-foot { display:none; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .form-grid { grid-template-columns:1fr; }
  .content { padding:16px; }
  .topbar { padding:12px 16px; }
}

/* ── Premium polish ── */
body { font-feature-settings:"ss01"; }
.sidebar { backdrop-filter:saturate(160%) blur(14px); }
.card, .stat-card {
  border:1px solid rgba(13,42,92,.08);
  box-shadow:0 1px 2px rgba(10,30,60,.04), 0 10px 28px -14px rgba(10,30,60,.12);
  border-radius:16px;
}
table { border-collapse:separate; border-spacing:0; }
thead th { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#66788f; }
tbody td, tbody th { border-bottom:1px solid #eef2f7; }
tbody tr:hover td { background:#f8fafc; }
button, .btn, [class*="btn-"] { transition:transform .15s ease, box-shadow .2s ease, background .2s ease; }
button:active { transform:scale(.97); }
input, select, textarea { border-radius:10px; border-color:#dfe6f0; transition:border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(183,28,28,.12); outline:none; }
h1, h2, h3 { letter-spacing:-.02em; }
.badge, [class*="badge"] { font-variant-numeric:tabular-nums; }
</style>

<script>
'use strict';
const API = '/api/myshop_api.php';
const TOKEN_KEY = 'ms_token';

function getToken() { return localStorage.getItem(TOKEN_KEY) || localStorage.getItem('aff_token') || ''; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n) { return 'Bs ' + Number(n || 0).toFixed(2); }
function fmtDate(d) { if (!d) return '—'; return String(d).replace('T',' ').substring(0,16); }

async function api(action, data = {}, method = 'POST') {
  const token = getToken();
  const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  let url = API, body = undefined;
  if (method === 'GET') {
    const p = action.split('?');
    url += '?action=' + encodeURIComponent(p[0]);
    if (p[1]) url += '&' + p[1];
    const ex = new URLSearchParams(data).toString();
    if (ex) url += '&' + ex;
  } else {
    body = new URLSearchParams({ action, ...data }).toString();
  }
  const res = await fetch(url, { method, headers, body });
  const j = await res.json();
  if (!j.success) throw new Error(j.error || j.msg || 'Error de API');
  return j;
}

let toastTimer = null;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2600);
}

function showModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });

function badgeEstado(v) {
  const map = { pagado:'success', aprobada:'success', activo:'success', entregado:'success', pagada:'success', completado:'success', resuelto:'success',
    pendiente:'warning', procesando:'info', enviado:'info', aprobado:'success', rechazado:'danger', cancelado:'danger', suspendido:'danger', reembolsado:'danger' };
  return '<span class="badge badge-' + (map[v] || 'neutral') + '">' + esc(v || '—') + '</span>';
}

0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>️ Configuración' };

function navigate(page) {
  if (page === 'logout') { localStorage.removeItem('aff_token'); localStorage.removeItem('ms_token'); window.location.href = '/'; return; }
  currentPage = page;
  document.querySelectorAll('#sideNav button[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('pageTitle').innerHTML = TITLES[page] || 'Admin';
  loadPage(page);
}
document.querySelectorAll('#sideNav button[data-page]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.page)));

async function loadPage(page) {
  const c = document.getElementById('content');

function resolverReclamo(id) {
  showModal(`
    <button class="close-x" onclick="closeModal()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h3>Resolver reclamación #${id}</h3>
    <div class="form-group mt-2"><label>Resolución</label><textarea id="reclResol" rows="4" placeholder="Describe la solución..."></textarea></div>
    <div class="form-group mt-2"><label>Estado</label>
      <select id="reclEstado"><option value="resuelto">Resuelto</option><option value="rechazado">Rechazado</option></select>
    </div>
    <div class="mt-3 flex"><button class="btn btn-primary" style="flex:1" onclick="confirmarReclamo(${id})">Guardar</button><button class="btn btn-outline" onclick="closeModal()">Cancelar</button></div>
  `);
}
async function confirmarReclamo(id) {
  const resolucion = document.getElementById('reclResol').value;
  const estado = document.getElementById('reclEstado').value;
  try { await api('admin_resolver_reclamacion', { id, resolucion, estado }); toast('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><circle cx="12" cy="12" r="10"/><path d="m9 12.5 2 2 4.5-4.5"/></svg> Reclamación resuelta', 'ok'); closeModal(); render_reclamaciones(); }
  catch (e) { toast('<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M18 6 6 18M6 6l12 12"/></svg> ' + e.message, 'err'); }
}

async function guardarConfig() {
  const data = {};
  document.querySelectorAll('#content input[data-clave]').forEach(i => data[i.dataset.clave] = i.value);
  try { await api('admin_config', data); toast('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><circle cx="12" cy="12" r="10"/><path d="m9 12.5 2 2 4.5-4.5"/></svg> Configuración guardada', 'ok'); }
  catch (e) { toast('<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M18 6 6 18M6 6l12 12"/></svg> ' + e.message, 'err'); }
}

// ============ INICIO ============
(async function init() {
  try {
    const r = await api('auth_me', {}, 'GET');
    if (!r.usuario || r.usuario.rol !== 'admin') throw new Error('No autorizado');
    document.getElementById('adminName').textContent = r.usuario.nombre;
    document.getElementById('adminAvatar').textContent = (r.usuario.nombre || 'A').charAt(0).toUpperCase();
    refreshSolicitudes();
    navigate('dashboard');
  } catch (e) {
    // Sin token válido -> login
    showModal(`
      <button class="close-x" onclick="closeModal()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div style="text-align:center;margin-bottom:18px;">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#b71c1c,#7f0f0f);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;margin:0 auto 10px;">M</div>
        <h3 style="font-size:17px;font-weight:700;">Acceso Administrador</h3>
        <p style="font-size:12px;color:var(--muted);margin-top:4px;">Solo personal autorizado de MyShop</p>
      </div>
      <div id="loginErr" style="display:none;background:#fee2e2;color:#b91c1c;font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:12px;"></div>
      <div class="form-group mb-2"><label>WhatsApp</label><input id="loginWa" type="text" placeholder="59176219693" value="59176219693"></div>
      <div class="form-group mb-2"><label>Contraseña</label><input id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary" style="width:100%;height:42px;font-size:14px;" onclick="doLogin()">Ingresar</button>
    `);
    window.doLogin = async function() {
      const wa = document.getElementById('loginWa').value.trim();
      const pass = document.getElementById('loginPass').value;
      const err = document.getElementById('loginErr');
      try {
        const r = await api('auth_login', { whatsapp: wa, password: pass });
        if (!r.usuario || r.usuario.rol !== 'admin') throw new Error('No tienes rol de administrador');
        localStorage.setItem('aff_token', r.token);
        localStorage.setItem('ms_token', r.token);
        closeModal();
        location.reload();
      } catch (e2) {
        if (err) { err.textContent = e2.message || 'Credenciales inválidas'; err.style.display = 'block'; }
      }
    };
  }
})();
</script>

<script>
(function(){
  var b=document.getElementById('bnrGen'); if(!b) return;
  b.addEventListener('click',function(){
    var st=document.getElementById('bnrStatus'), pv=document.getElementById('bnrPreview'), op=document.getElementById('bnrOpen');
    b.disabled=true; st.textContent='Generando con IA (puede tardar ~15s)...';
    fetch('/api/banner_gen.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tema:(document.getElementById('bnrTema')||{}).value||''})})
    .then(function(r){return r.json();})
    .then(function(d){
      b.disabled=false;
      if(d&&d.success&&d.url){st.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M20 6 9 17l-5-5"/></svg> Listo: '+d.url;pv.src=d.url;pv.style.display='block';op.href=d.url;op.style.display='inline';}
      else{st.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M18 6 6 18M6 6l12 12"/></svg> '+(d&&d.error?d.error:'Error');}
    })
    .catch(function(){b.disabled=false;st.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M18 6 6 18M6 6l12 12"/></svg> Error de red';});
  });
})();
</script>
