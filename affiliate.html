<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyShop - Panel Afiliado</title>
<link rel="stylesheet" href="css/styles.css">
<script src="js/static-mode.js"></script>
</head>
<body>
<div class="sidebar-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>MyShop</h2>
      <small>Panel Afiliado</small>
    </div>
    <nav class="sidebar-nav">
      <button class="active" onclick="navigate('dashboard')"><span class="icon">&#x1F4CA;</span><span>Dashboard</span></button>
      <button onclick="navigate('productos')"><span class="icon">&#x1F4E6;</span><span>Productos</span></button>
      <button onclick="navigate('links')"><span class="icon">&#x1F517;</span><span>Mis Links</span></button>
      <button onclick="navigate('ventas')"><span class="icon">&#x1F4B0;</span><span>Mis Ventas</span></button>
      <button onclick="navigate('comisiones')"><span class="icon">&#x1F4B5;</span><span>Comisiones</span></button>
      <button onclick="navigate('pagos')"><span class="icon">&#x1F4B3;</span><span>Pagos</span></button>
      <button onclick="navigate('perfil')"><span class="icon">&#x1F464;</span><span>Mi Perfil</span></button>
      <hr style="border-color:rgba(255,255,255,.1);margin:12px 20px;">
      <a href="/"><span class="icon">&#x1F3EA;</span><span>Tienda</span></a>
      <button onclick="API.auth.logout()" style="color:var(--danger);"><span class="icon">&#x1F6AA;</span><span>Cerrar sesión</span></button>
    </nav>
  </aside>

  <div class="main-content">
    <header class="main-header">
      <h2 id="pageTitle">Dashboard</h2>
      <div id="affiliateInfo" style="font-size:14px;color:var(--gray-500);"></div>
    </header>
    <div class="main-body" id="mainBody">
      <div class="loading-wrap"><div class="spinner"></div><span>Cargando...</span></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
let currentUser = null;
let affCode = '';

(async () => {
  try {
    const r = await API.auth.me();
    if (!r.afiliado || r.afiliado.estado !== 'activo') throw new Error('No eres un afiliado activo');
    currentUser = r.usuario;
    affCode = r.afiliado.codigo;
    document.getElementById('affiliateInfo').innerHTML = `Código: <strong>${affCode}</strong> | ${r.usuario.nombre}`;
    navigate('dashboard');
  } catch (e) {
    if (e.message.includes('Token')) window.location.href = '/login';
    else { showToast('&#x274C; ' + e.message); setTimeout(() => window.location.href = '/login', 2000); }
  }
})();

function navigate(page) {
  document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('active'));
  event?.target?.closest('button')?.classList.add('active');
  const titles = { dashboard: '&#x1F4CA; Dashboard', productos: '&#x1F4E6; Productos', links: '&#x1F517; Mis Links', ventas: '&#x1F4B0; Mis Ventas', comisiones: '&#x1F4B5; Comisiones', pagos: '&#x1F4B3; Pagos', perfil: '&#x1F464; Mi Perfil' };
  document.getElementById('pageTitle').textContent = titles[page] || 'Afiliado';
  loadPage(page);
}

async function loadPage(page) {
  const body = document.getElementById('mainBody');
  body.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><span>Cargando...</span></div>';
  try { await window['render_' + page](); } catch (e) { body.innerHTML = `<div class="alert alert-error">Error: ${e.message}</div>`; }
}

// ============== DASHBOARD ==============
async function render_dashboard() {
  const r = await API.affiliate.dashboard();
  const d = r.stats || {};
  document.getElementById('mainBody').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Ventas Generadas</div><div class="stat-value">Bs ${Number(d.ventas_monto || 0).toFixed(2)}</div><div class="stat-sub">${d.ventas_count || 0} pedidos</div></div>
      <div class="stat-card"><div class="stat-label">Comisiones Pendientes</div><div class="stat-value">Bs ${Number(d.comisiones_pendientes || 0).toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">Comisiones Aprobadas</div><div class="stat-value">Bs ${Number(d.comisiones_aprobadas || 0).toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">Comisiones Pagadas</div><div class="stat-value">Bs ${Number(d.comisiones_pagadas || 0).toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">Ticket Promedio</div><div class="stat-value">Bs ${Number(d.ticket_promedio || 0).toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">Tu Código</div><div class="stat-value" style="font-size:24px;font-family:monospace;">${affCode}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>Tu enlace de referido</h2></div>
      <div style="display:flex;gap:12px;">
        <input class="form-input" id="refLink" value="https://myshop.flaapi.com/${affCode}" readonly style="flex:1;cursor:pointer;" onclick="this.select();navigator.clipboard.writeText(this.value);showToast('&#x2705; Enlace copiado')">
        <button class="btn btn-primary" onclick="copiarLink()">Copiar</button>
      </div>
      <p class="text-sm text-muted mt-2">Comparte este enlace en WhatsApp, Facebook, Instagram o Telegram. Cuando alguien compre, ganarás una comisión.</p>
    </div>
  `;
}

function copiarLink() {
  const el = document.getElementById('refLink');
  el.select();
  navigator.clipboard.writeText(el.value).then(() => showToast('&#x2705; Enlace copiado al portapapeles')).catch(() => {});
}

// ============== PRODUCTOS ==============
async function render_productos() {
  document.getElementById('mainBody').innerHTML = `
    <div class="search-bar">
      <input type="text" id="prodSearch" placeholder="Buscar productos..." oninput="debounceProdSearch()">
    </div>
    <div class="product-grid" id="affiliateProductGrid">
      <div class="loading-wrap"><div class="spinner"></div><span>Cargando...</span></div>
    </div>
  `;
  loadAffProducts();
}

let prodSearchTimer = null;
function debounceProdSearch() {
  clearTimeout(prodSearchTimer);
  prodSearchTimer = setTimeout(loadAffProducts, 400);
}

async function loadAffProducts() {
  const q = document.getElementById('prodSearch')?.value?.trim() || '';
  try {
    const r = await API.products.search(q);
    const grid = document.getElementById('affiliateProductGrid');
    grid.innerHTML = '';
    (r.productos || []).forEach(p => {
      const link = `https://myshop.flaapi.com/${affCode}?sku=${p.sku}`;
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img class="product-img" src="${(p.images && p.images[0]) || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22300%22/%3E%3Ctext fill=%22%23999%22 font-size=%2216%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dominant-baseline=%22central%22%3EMyShop%3C/text%3E%3C/svg%3E'}" alt="${p.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22300%22/%3E%3Ctext fill=%22%23999%22 font-size=%2216%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dominant-baseline=%22central%22%3EMyShop%3C/text%3E%3C/svg%3E'">
        <div class="product-info">
          <div class="product-sku">${p.sku}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">Bs ${Number(p.price).toFixed(2)}</div>
          <div class="product-actions" style="flex-direction:column;gap:4px;">
            <button class="btn btn-primary btn-sm btn-block" onclick="copiarTextoEnlace('${link}', '${p.sku}')">&#x1F517; Copiar Link</button>
            <div class="flex gap-2" style="width:100%;">
              <button class="btn btn-sm btn-secondary" style="flex:1;" onclick="compartirWA('${link}', '${p.name}')">&#x1F4F1; WA</button>
              <button class="btn btn-sm btn-secondary" style="flex:1;" onclick="compartirFB('${link}')">📘 FB</button>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    if (!r.productos || r.productos.length === 0) grid.innerHTML = '<div class="loading-wrap"><span style="font-size:40px;">&#x1F4E6;</span><span>No se encontraron productos</span></div>';
  } catch (e) {
    document.getElementById('affiliateProductGrid').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

function copiarTextoEnlace(link, sku) {
  const texto = `🛍️ Te recomiendo este producto de MyShop Bolivia!\n\n&#x1F4CC; SKU: ${sku}\n&#x1F517; ${link}\n\n&#x1F4B3; Pago con QR, envío a todo Bolivia.`;
  navigator.clipboard.writeText(texto).then(() => showToast('&#x2705; Texto + enlace copiado! Pégalo en WhatsApp')).catch(() => {});
}

function compartirWA(link, nombre) {
  const texto = encodeURIComponent(`🛍️ *${nombre}*\n\n&#x2705; Precio especial en MyShop Bolivia\n&#x1F517; ${link}\n\n&#x1F4B3; Paga con QR - Envío a todo el país`);
  window.open(`https://wa.me/?text=${texto}`, '_blank');
}

function compartirFB(link) {
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`, '_blank');
}

// ============== LINKS ==============
async function render_links() {
  const r = await API.affiliate.links();
  document.getElementById('mainBody').innerHTML = `
    <div class="card">
      <div class="card-header"><h2>Enlaces Generados</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Producto</th><th>Enlace</th><th>Clics</th><th>Conversiones</th><th>Fecha</th></tr></thead>
          <tbody>
            ${(r.productos || []).map(l => `
              <tr>
                <td>${l.nombre || l.sku || '-'}</td>
                <td><small class="truncate" style="display:block;max-width:300px;">${l.link || '—'}</small></td>
                <td>${l.clics || 0}</td>
                <td>${l.conversiones || 0}</td>
                <td class="text-sm">${'—'}</td>
              </tr>
            `).join('')}
            ${(!r.links || r.links.length === 0) ? '<tr><td colspan="5" class="text-center text-muted">Aún no has generado enlaces. Ve a Productos y comparte!</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ============== VENTAS ==============
async function render_ventas() {
  const r = await API.affiliate.ventas();
  document.getElementById('mainBody').innerHTML = `
    <div class="card">
      <div class="card-header"><h2>Mis Ventas</h2></div>
      ${(!r.ventas || r.ventas.length === 0) ? '<p class="text-muted">Aún no tienes ventas. Comparte tu enlace de referido!</p>' : `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Pedido</th><th>Cliente</th><th>Producto</th><th>Total Venta</th><th>Comisión</th><th>Estado</th><th>Fecha</th></tr></thead>
          <tbody>
            ${r.ventas.map(v => `
              <tr>
                <td><strong>${v.pedido_id}</strong></td>
                <td>${v.cliente_nombre || '-'}</td>
                <td><small>${v.productos || '—'}</small></td>
                <td>Bs ${Number(v.total).toFixed(2)}</td>
                <td><strong>Bs ${Number(v.comision_monto || 0).toFixed(2)}</strong></td>
                <td><span class="badge badge-${v.estado === 'entregado' ? 'success' : v.estado === 'cancelado' ? 'danger' : 'warning'}">${v.estado_pedido || v.estado_comision || 'pendiente'}</span></td>
                <td class="text-sm">${v.fecha_creacion || ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;
}

// ============== COMISIONES ==============
async function render_comisiones() {
  const r = await API.affiliate.comisiones();
  document.getElementById('mainBody').innerHTML = `
    <div class="card">
      <div class="card-header"><h2>Mis Comisiones</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Pedido</th><th>Venta</th><th>%</th><th>Comisión</th><th>Estado</th><th>Fecha</th></tr></thead>
          <tbody>
            ${(r.comisiones || []).map(c => `
              <tr>
                <td>${c.pedido_id}</td>
                <td>Bs ${Number(c.pedido_total).toFixed(2)}</td>
                <td>${c.comision_porcentaje}%</td>
                <td><strong>Bs ${Number(c.comision_monto).toFixed(2)}</strong></td>
                <td><span class="badge badge-${c.estado === 'aprobada' ? 'success' : c.estado === 'pagada' ? 'info' : c.estado === 'rechazada' ? 'danger' : 'warning'}">${c.estado}</span></td>
                <td class="text-sm">${c.fecha_generacion || ''}</td>
              </tr>
            `).join('')}
            ${(!r.comisiones || r.comisiones.length === 0) ? '<tr><td colspan="6" class="text-center text-muted">Sin comisiones aún</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ============== PAGOS ==============
async function render_pagos() {
  const r = await API.affiliate.pagos();
  document.getElementById('mainBody').innerHTML = `
    <div class="card">
      <div class="card-header"><h2>Mis Pagos</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Comisión</th><th>Monto</th><th>Método</th><th>Estado</th><th>Fecha</th></tr></thead>
          <tbody>
            ${(r.pagos || []).map(p => `
              <tr>
                <td>${p.id}</td>
                <td>${p.comision_id || '-'}</td>
                <td><strong>Bs ${Number(p.monto).toFixed(2)}</strong></td>
                <td>${p.metodo || '-'}</td>
                <td><span class="badge badge-${p.estado === 'completado' ? 'success' : 'warning'}">${p.estado}</span></td>
                <td class="text-sm">${p.fecha_pago || ''}</td>
              </tr>
            `).join('')}
            ${(!r.pagos || r.pagos.length === 0) ? '<tr><td colspan="6" class="text-center text-muted">Sin pagos registrados</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ============== PERFIL ==============
async function render_perfil() {
  const r = await API.affiliate.perfil();
  const a = r.afiliado || {};
  document.getElementById('mainBody').innerHTML = `
    <div class="card" style="max-width:500px;">
      <div class="card-header"><h2>Mi Perfil</h2></div>
      <div class="form-group">
        <label>Código de afiliado</label>
        <input class="form-input" value="${a.codigo || affCode}" readonly style="background:var(--gray-100);font-family:monospace;">
      </div>
      <div class="form-group">
        <label>Nivel</label>
        <input class="form-input" value="${a.nivel || 'bronce'}" readonly style="background:var(--gray-100);">
      </div>
      <div class="form-group">
        <label>Estado</label>
        <input class="form-input" value="${a.afi_estado || 'activo'}" readonly style="background:var(--gray-100);">
      </div>
      <hr style="margin:16px 0;border:none;border-top:1px solid var(--gray-200);">
      <div class="form-group">
        <label>Nombre</label>
        <input class="form-input" id="perfNombre" value="${currentUser?.nombre || ''}">
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input class="form-input" id="perfWhatsapp" value="${currentUser?.whatsapp || ''}" readonly style="background:var(--gray-100);">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input class="form-input" id="perfEmail" value="${currentUser?.email || ''}" placeholder="correo@ejemplo.com">
      </div>
      <button class="btn btn-primary" onclick="actualizarPerfil()">Actualizar Perfil</button>
    </div>
  `;
}

async function actualizarPerfil() {
  await API.affiliate.actualizarPerfil({ nombre: document.getElementById('perfNombre').value.trim() });
  showToast('&#x2705; Perfil actualizado');
}

// ============== HELPERS ==============
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;right:20px;background:#1f2937;color:#fff;padding:14px 24px;border-radius:8px;z-index:9999;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.3);';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 500); }, 3000);
}
</script>
</body>
</html>
